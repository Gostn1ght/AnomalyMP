name: Lost Zone World Foundation

on:
  push:
    branches: [menu-3d-hideout]
    paths:
      - 'src/xrEngine/xrSheduler*'
      - 'src/xrEngine/xrSchedulerRegistration.h'
      - 'src/xrEngine/xrSchedulerTickets.h'
      - 'src/xrEngine/ISheduled*'
      - 'src/xrCore/profiler.h'
      - 'scripts/check-netcoop-scheduler.py'
      - 'scripts/fixtures/ixray-scheduler/**'
      - 'scripts/fixtures/hash-scheduler/**'
      - 'src/xrGame/netcoop_world_clock.h'
      - 'src/xrEngine/device.cpp'
      - 'src/xrServerEntities/xrMessages.h'
      - 'src/xrGame/netcoop_bots.cpp'
      - 'src/xrGame/netcoop_bot_gap_probe.h'
      - 'scripts/check-netcoop-bot-gap.py'
      - 'src/xrGame/netcoop_world_authority.h'
      - 'src/xrGame/netcoop_alife_clock.h'
      - 'src/xrGame/alife_time_manager*'
      - 'src/xrGame/alife_simulator.cpp'
      - 'src/xrGame/alife_storage_manager.cpp'
      - 'src/xrGame/game_sv_single.cpp'
      - 'scripts/check-netcoop-alife-clock.py'
      - 'scripts/check-netcoop-world-clock.py'
      - 'src/xrGame/netcoop_world_store.inc'
      - 'scripts/check-netcoop-world-store.py'
      - 'src/xrGame/netcoop_spatial_grid.h'
      - 'src/xrGame/netcoop_simulation_lod.h'
      - 'src/xrGame/netcoop_world_bridge.h'
      - 'src/xrGame/netcoop_world_bridge.inc'
      - 'src/xrGame/netcoop_world_bridge_worker.cpp'
      - 'src/xrGame/netcoop_world_bridge_worker.h'
      - 'src/xrGame/xrServer.cpp'
      - 'src/xrGame/xrServer.h'
      - 'scripts/check-netcoop-spatial-grid.py'
      - 'scripts/check-netcoop-simulation-lod.py'
      - 'scripts/check-netcoop-world-bridge.py'
      - 'src/xrGame/netcoop_corpse_inventory.h'
      - 'src/xrGame/alife_simulator_base.cpp'
      - 'src/xrGame/xrServer_process_event_destroy.cpp'
      - 'scripts/check-netcoop-corpse-inventory.py'
      - 'src/xrGame/inventory_item.cpp'
      - 'src/xrGame/Weapon.cpp'
      - 'src/xrGame/Grenade.cpp'
      - 'src/xrGame/Missile.cpp'
      - 'scripts/check-netcoop-item-lifetime.py'
      - 'src/xrGame/netcoop_replication_index.cpp'
      - 'src/xrGame/netcoop_replication_index.h'
      - 'src/xrGame/netcoop_transit_queue.inc'
      - 'scripts/check-netcoop-transit-queue.py'
      - 'src/xrGame/netcoop_cluster.inc'
      - 'src/xrGame/netcoop_characters.inc'
      - 'scripts/check-netcoop-player-transfer.py'
      - 'src/xrGame/netcoop.cpp'
      - 'scripts/check-netcoop-account-store.py'
      - 'scripts/check-netcoop-session-ownership.py'
      - 'scripts/check-netcoop-character-commits.py'
      - 'scripts/check-netcoop-character-restore.py'
      - 'scripts/check-netcoop-replication-index.py'
      - 'scripts/fixtures/full-rate-cadence/**'
      - '.github/workflows/lostzone-world-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clock-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise actual clock and location follower
        run: python scripts/check-netcoop-world-clock.py
      - name: Compare actual scheduler with pinned IX-Ray and check callback lifetimes
        run: python scripts/check-netcoop-scheduler.py
      - name: Separate bot delivery and processing gaps
        run: python scripts/check-netcoop-bot-gap.py
      - name: Exercise actual spatial grid and player interests
        run: python scripts/check-netcoop-spatial-grid.py
      - name: Exercise simulation LOD and representation barriers
        run: python scripts/check-netcoop-simulation-lod.py
      - name: Exercise read-only world bridge and wire protocol
        run: python scripts/check-netcoop-world-bridge.py
      - name: Exercise snapshot slot recovery
        run: python scripts/check-netcoop-world-store.py
      - name: Exercise corpse cleanup without deleting inventory
        run: python scripts/check-netcoop-corpse-inventory.py
      - name: Exercise persistent ground items and armed grenade fuses
        run: python scripts/check-netcoop-item-lifetime.py
      - name: Compare indexed replication candidates with native legacy cadence
        run: python scripts/check-netcoop-replication-index.py
      - name: Exercise ALife integration and durable ownership
        run: python scripts/check-netcoop-alife-clock.py
      - name: Exercise actual player handoff I/O failures
        run: python scripts/check-netcoop-player-transfer.py
      - name: Exercise bounded complete character commit queue
        run: python scripts/check-netcoop-character-commits.py
      - name: Exercise target character restore admission and failures
        run: python scripts/check-netcoop-character-restore.py
  clock-windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise actual clock with the engine toolchain
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          python scripts/check-netcoop-scheduler.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-bot-gap.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-world-clock.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-spatial-grid.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-simulation-lod.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-world-bridge.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-world-store.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-corpse-inventory.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-item-lifetime.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-replication-index.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-transit-queue.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-player-transfer.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-account-store.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-session-ownership.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-commits.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-restore.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-alife-clock.py
