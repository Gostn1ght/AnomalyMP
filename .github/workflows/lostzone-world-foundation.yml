permissions:
  contents: read

jobs:
  clock-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise actual clock and location follower
        run: python scripts/check-netcoop-world-clock.py
      - name: Compare actual scheduler with pinned IX-Ray and check callback lifetimes
        run: python scripts/check-netcoop-scheduler.py
      - name: Separate bot delivery and processing gaps
        run: python scripts/check-netcoop-bot-gap.py
      - name: Retry bot handoffs on the current map and follow auth redirects
        run: python scripts/check-netcoop-bot-target.py
      - name: Exercise actual spatial grid and player interests
        run: python scripts/check-netcoop-spatial-grid.py
      - name: Exercise simulation LOD and representation barriers
        run: python scripts/check-netcoop-simulation-lod.py
      - name: Exercise read-only world bridge and wire protocol
        run: python scripts/check-netcoop-world-bridge.py
      - name: Exercise physics-only prop checkpoints
        run: python scripts/check-netcoop-physics-save.py
      - name: Exercise actual breakable health checkpoints and spawn
        run: python scripts/check-netcoop-breakable-save.py
      - name: Exercise actual destroyable health and compatible spawn INI state
        run: python scripts/check-netcoop-destroyable-save.py
      - name: Exercise actual failed client start and input release
        run: python scripts/check-netcoop-failed-start-input.py
      - name: Exercise actual dialog callbacks closing the menu during Update
        run: python scripts/check-netcoop-dialog-update.py
      - name: Exercise snapshot slot recovery
        run: python scripts/check-netcoop-world-store.py
      - name: Exercise corpse cleanup without deleting inventory
        run: python scripts/check-netcoop-corpse-inventory.py
      - name: Exercise persistent ground items and armed grenade fuses
        run: python scripts/check-netcoop-item-lifetime.py
      - name: Compare indexed replication candidates with native legacy cadence
        run: python scripts/check-netcoop-replication-index.py
      - name: Exercise ALife integration and durable ownership
        run: python scripts/check-netcoop-alife-clock.py
      - name: Exercise actual player handoff I/O failures
        run: python scripts/check-netcoop-player-transfer.py
      - name: Exercise bounded complete character commit queue
        run: python scripts/check-netcoop-character-commits.py
      - name: Exercise target character restore admission and failures
        run: python scripts/check-netcoop-character-restore.py
      - name: Exercise actual character checksum portability and legacy migration
        run: python scripts/check-netcoop-character-checksum.py
      - name: Exercise actual native controlled-exit diagnostics
        run: python scripts/check-native-exit-log.py
      - name: Exercise actual native HUD stop sentinel and unchanged callbacks
        run: python scripts/check-native-hud-stop.py
      - name: Exercise actual local screenshot command permissions
        run: python scripts/check-native-console-capture.py
      - name: Check actual script-watchdog loading budget
        run: python scripts/check-native-script-watchdog.py
      - name: Check actual RP UI input while gameplay is locked
        run: python scripts/check-native-rp-input.py
      - name: Check actual pose-only physics replica dynamics
        run: python scripts/check-native-physics-replica.py
      - name: Check actual per-connection administrator god mode
        run: python scripts/check-native-admin-god.py
      - name: Check actual administrator demo teleport and prediction reset
        run: python scripts/check-native-admin-teleport.py
      - name: Check actual relation API with a missing player
        run: python scripts/check-native-relation-null.py
      - name: Actual environment display clock regression
        run: python scripts/check-native-environment-clock.py
      - name: Actual multiplayer transition invitations and live cluster config
        run: python scripts/check-native-level-transition.py
      - name: Actual authoritative contact push and sleeping props
        run: python scripts/check-native-physics-push.py
      - name: Actual GAMMA lighting getter and authoritative shot stimulus
        run: python scripts/check-native-perception-shot.py
      - name: Actual multiplayer fragment lifetime and single-player cleanup
        run: python scripts/check-native-fragment-lifetime.py
      - name: Actual blood decal and dynamic prop material invariant
        run: |
          python scripts/check-native-mark-material.py
          python scripts/check-native-crow-enemy.py
          python scripts/check-native-monster-snapshot.py
          python scripts/check-native-host-stop.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-projectile-shot.py
  clock-windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise actual PowerShell load driver and GAMMA empty-world PDA
        shell: pwsh
        run: |
          ./scripts/check-netcoop-load-harness.ps1
          ./scripts/check-netcoop-host-controls.ps1
          python -m pip install lupa==2.8 cryptography==46.0.2
          python scripts/check-netcoop-server-pda.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-netcoop-server-item-save.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual clock with the engine toolchain
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          python scripts/check-netcoop-scheduler.py
