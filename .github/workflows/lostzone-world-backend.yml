name: Lost Zone World Backend

on:
  push:
    branches: [menu-3d-hideout]
    paths:
      - 'backend/**'
      - '.github/workflows/lostzone-world-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check durable world, ledger, transfers and recovery
        run: python -m unittest discover -s backend/tests -v
