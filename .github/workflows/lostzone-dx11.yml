name: Lost Zone DX11

on:
  push:
    branches: [menu-3d-hideout]
    paths-ignore:
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/lostzone-world-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lostzone-dx11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check actual Lua menu and trade code
        run: |
          python -m pip install lupa==2.8
          python scripts/check-netcoop-menu.py
          python scripts/check-netcoop-trade.py
          python scripts/check-netcoop-inventory-compat.py
          python scripts/check-netcoop-ai.py
          python scripts/check-netcoop-vision-cadence.py
          python scripts/check-netcoop-items.py
          python scripts/check-netcoop-world-rules.py
          python scripts/check-netcoop-sandbox.py
          python scripts/check-netcoop-traders.py
          python scripts/check-netcoop-box-contents.py
          python scripts/check-netcoop-distant-battles.py
          python scripts/check-netcoop-world-events.py
          python scripts/check-netcoop-respawn-state.py
          python scripts/check-netcoop-full-map-plan.py
          python scripts/check-netcoop-legacy-dialog.py
          python scripts/check-netcoop-pickup-fallback.py
          python scripts/check-netcoop-admin-commands.py
          python scripts/check-netcoop-actor-conditions.py
          python scripts/check-netcoop-transit.py
          python scripts/check-netcoop-lua-scope.py
          python scripts/check-netcoop-factions.py
          python scripts/check-netcoop-cluster-weather.py
          python scripts/check-netcoop-contracts.py
          python scripts/check-netcoop-ranks.py
          python scripts/check-netcoop-squads.py
          python scripts/check-netcoop-corpses.py
          python scripts/check-netcoop-pda.py
          python scripts/check-netcoop-emission.py
          python scripts/check-netcoop-psi-storm.py
          python scripts/check-netcoop-item-use.py
          python scripts/check-netcoop-mutant-loot.py
          python scripts/check-netcoop-pdanet.py
      - name: Check actual item interpolation
        run: python scripts/check-netcoop-physics.py
      - name: Check actual startup menu audio
        run: python scripts/check-menu-audio.py
      - name: Check actual Firebase verification links
        run: python scripts/check-firebase-links.py
      - name: Check actual keyboard and clipboard paste
        run: python scripts/check-edit-input.py

  engine:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Check load harness and empty-server PDA before building
        shell: pwsh
        run: |
          ./scripts/check-netcoop-load-harness.ps1
          ./scripts/check-netcoop-host-controls.ps1
          python -m pip install lupa==2.8
          python scripts/check-netcoop-server-pda.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-netcoop-server-item-save.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows mail and clipboard API types
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          python scripts/check-netcoop-scheduler.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-bot-gap.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-bot-target.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-windows-auth-api.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-transit-queue.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-player-transfer.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-account-store.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-session-ownership.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-commits.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-restore.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-physics-save.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-breakable-save.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-destroyable-save.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-failed-start-input.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-dialog-update.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-exit-log.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-hud-stop.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-console-capture.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-script-watchdog.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-rp-input.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-physics-replica.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-admin-god.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-admin-teleport.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-relation-null.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-environment-clock.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-level-transition.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-physics-push.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-perception-shot.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-fragment-lifetime.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-mark-material.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-crow-enemy.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-monster-snapshot.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-native-host-stop.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-weapon-menu.py
          if errorlevel 1 exit /b %errorlevel%
          python scripts/check-netcoop-character-checksum.py
      - name: Check actor packet compatibility
        shell: pwsh
        run: ./scripts/check-actor-packet.ps1
      - name: Check item instance state model
        shell: pwsh
        run: ./scripts/check-item-state.ps1
      - name: Build DX11 on GitHub Actions
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Build must run on GitHub Actions' }
          msbuild src/engine-vs2022.sln /m:2 /p:Configuration=DX11 /p:Platform=x64 /p:MultiProcessorCompilation=false /bl:lostzone-build.binlog /fl /flp:logfile=lostzone-build.log /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
      - name: Package matching client, server and overlays
        shell: pwsh
        run: |
          ./scripts/package-m1-dx11.ps1 -BuildBin ./_build/_game/bin_dbg -DestinationRoot ./lostzone-package
          Copy-Item -LiteralPath scripts/netcoop-overlay -Destination lostzone-package/overlay -Recurse
          Copy-Item -LiteralPath scripts/netcoop-cluster -Destination lostzone-package/hoster -Recurse
          Copy-Item -LiteralPath scripts/start-lostzone-cluster.cmd -Destination lostzone-package/1-Cluster.cmd
          New-Item -ItemType Directory -Path lostzone-package/notices -Force | Out-Null
          Copy-Item -LiteralPath scripts/fixtures/ixray-scheduler/LICENSE.md -Destination lostzone-package/notices/IX-Ray-LICENSE.md
          Copy-Item -LiteralPath scripts/start-lostzone-world.cmd -Destination lostzone-package/1-Server.cmd
          Copy-Item -LiteralPath _build/_game/bin_dbg/LostZoneDX11.pdb -Destination lostzone-package/bin/LostZoneClientDX11.pdb
          Copy-Item -LiteralPath _build/_game/bin_dbg/LostZoneDX11.pdb -Destination lostzone-package/dedicated/LostZoneServerDX11.pdb
          Set-Content -LiteralPath lostzone-package/built-from.txt -Value $env:GITHUB_SHA
          Get-FileHash lostzone-package/bin/LostZoneClientDX11.exe,lostzone-package/dedicated/LostZoneServerDX11.exe | Format-List | Out-File lostzone-package/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LostZone-DX11-client-server
          path: lostzone-package
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LostZone-DX11-build-log
          path: |
            lostzone-build.log
            lostzone-build.binlog
          if-no-files-found: ignore
